name: fmt
on:
  push:
    branches: [main]
    paths: ['en/getting-started-guides/getting-started-guides-1.md']
permissions:
  contents: write
jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          npx --yes prettier@3 --write "en/getting-started-guides/getting-started-guides-1.md"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "style: prettier" && git push)
